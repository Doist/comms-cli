name: Skill Sync Check

on:
    pull_request:

permissions:
    contents: read

jobs:
    skill-sync:
        name: SKILL.md Sync
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout Comms SDK (sibling dep via file:../comms-sdk-typescript)
              uses: actions/checkout@v5
              with:
                  repository: Doist/comms-sdk-typescript
                  path: comms-sdk-typescript
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkout
              uses: actions/checkout@v5
              with:
                  path: comms-cli

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: comms-cli/.nvmrc
                  cache: 'npm'
                  cache-dependency-path: comms-cli/package-lock.json

            - name: Install dependencies
              working-directory: comms-cli
              run: npm ci

            - name: Build
              working-directory: comms-cli
              run: npm run build

            - name: Check SKILL.md is in sync
              working-directory: comms-cli
              run: npm run check:skill-sync

            - name: Validate SKILL.md against agentskills.io spec
              working-directory: comms-cli
              run: |
                  if ! gh skill --help >/dev/null 2>&1; then
                      echo "::notice::gh skill subcommand not available on this runner (requires gh >= 2.90.0); skipping validation"
                      exit 0
                  fi
                  gh skill publish --dry-run
              env:
                  GH_TOKEN: ${{ github.token }}
