name: Release artifact

on:
    push:
        branches: [main, next]
    workflow_dispatch:

# semantic-release dry-run checks push authorization. This workflow never pushes or publishes.
permissions:
    contents: write
    actions: read

concurrency:
    group: release-artifact-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0
            # Keep HEAD attached at the event SHA: semantic-release must not move a detached
            # checkout to a newer branch tip during its history fetch.
            - name: Attach reviewed event commit
              env:
                  RELEASE_BRANCH: ${{ github.ref_name }}
                  RELEASE_SHA: ${{ github.sha }}
              run: git checkout -B "$RELEASE_BRANCH" "$RELEASE_SHA"
            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci --ignore-scripts --no-audit --no-fund
            - run: npm run verify
            - name: Analyze and pack once
              id: prepare
              run: node scripts/prepare-release.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
            - uses: actions/upload-artifact@v4
              if: steps.prepare.outputs.prepared == 'true'
              with:
                  name: release-${{ github.run_id }}-${{ github.run_attempt }}
                  path: .tmp/release/
                  if-no-files-found: error
                  retention-days: 90
